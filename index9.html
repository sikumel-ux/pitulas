<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekawan - Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; padding-bottom: 120px; }
        
        .header-top {
            background-image: url('20260308_194220.jpg');
            background-size: cover; background-position: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; min-height: 140px;
            display: flex; flex-direction: column; justify-content: center;
            padding: 0 25px;
        }
        .header-top::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(5, 58, 111, 0.4) 0%, rgba(5, 58, 111, 0.8) 100%);
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        /* Navigasi Atas 2 Kolom */
        .top-cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: -25px; position: relative; z-index: 20; padding: 0 20px; }
        .top-cat-item { 
            background: white; padding: 12px; border-radius: 20px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer;
            border: 2px solid transparent;
        }
        .top-cat-item.active { border-color: #facc15; background: #053a6f; color: white; }
        .top-cat-item i { font-size: 16px; margin-bottom: 4px; display: block; }
        .top-cat-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; }

        .story-card { aspect-ratio: 3/4; border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.08); background: #fff; }
        .story-overlay { 
            position: absolute; inset: 0; 
            background: linear-gradient(0deg, rgba(5, 58, 111, 0.95) 0%, rgba(5, 58, 111, 0.2) 60%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 18px;
        }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: #053a6f; border-radius: 25px; display: flex; 
            justify-content: space-around; padding: 12px 5px; z-index: 2000; /* Z-index tertinggi */
            box-shadow: 0 15px 30px rgba(5, 58, 111, 0.4);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: white; opacity: 0.4; transition: 0.3s; background: none; border: none; flex: 1; }
        .nav-item.active { opacity: 1; color: #facc15; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item span { font-size: 7px; font-weight: 800; text-transform: uppercase; }

        /* Reader Full Page tetap di bawah Nav */
        #reader { position: fixed; inset: 0; background: white; z-index: 1000; display: none; overflow-y: auto; padding-bottom: 100px; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeInUp 0.4s ease forwards; }
    </style>
</head>
<body>

    <div class="header-top text-white">
        <div class="relative z-10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter text-[#facc15]">SEKAWAN</h1>
                <p class="text-[9px] font-bold opacity-80 tracking-[3px] uppercase">Digital Library</p>
            </div>
            <a href="admin.html" class="opacity-60"><i class="fa-solid fa-fingerprint text-2xl"></i></a>
        </div>
    </div>

    <div class="top-cat-grid">
        <div onclick="filterCat('Suami')" class="top-cat-item cat-btn" data-cat="Suami">
            <i class="fa-solid fa-house-user"></i><span>Suami</span>
        </div>
        <div onclick="filterCat('Mertua')" class="top-cat-item cat-btn" data-cat="Mertua">
            <i class="fa-solid fa-heart"></i><span>Mertua</span>
        </div>
    </div>

    <main class="px-5 py-8">
        <div class="grid grid-cols-2 gap-4" id="user-grid">
            <div class="story-card animate-pulse bg-gray-200"></div>
            <div class="story-card animate-pulse bg-gray-200"></div>
        </div>
        <button id="loadMoreBtn" onclick="loadMore()" class="hidden mx-auto mt-6 bg-[#053a6f] text-white px-6 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest">Muat Lebih Banyak</button>
    </main>

    <nav class="bottom-nav">
        <button onclick="filterCat('Semua')" class="nav-item active" data-nav="Semua"><i class="fa-solid fa-ghost"></i><span>Explore</span></button>
        <button onclick="filterCat('3S')" class="nav-item" data-nav="3S"><i class="fa-solid fa-fire"></i><span>3S</span></button>
        <button onclick="filterCat('Teman')" class="nav-item" data-nav="Teman"><i class="fa-solid fa-comment"></i><span>Teman</span></button>
        <button onclick="window.location.href='index.html'" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </nav>

    <div id="reader">
        <div class="relative w-full h-[50vh]">
            <img id="viewImg" class="w-full h-full object-cover">
            <button onclick="closeReader()" class="absolute top-6 left-6 w-10 h-10 bg-black/40 backdrop-blur-md text-white rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        <div class="p-8 -mt-10 bg-white rounded-t-[40px] relative z-10 min-h-screen">
            <span id="viewCat" class="bg-yellow-100 text-[#053a6f] px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest"></span>
            <h2 id="viewJudul" class="text-2xl font-black text-[#053a6f] mt-4 leading-tight"></h2>
            <div class="w-12 h-1 bg-yellow-400 my-6 rounded-full"></div>
            <p id="viewIsi" class="text-gray-600 leading-relaxed text-[15px] whitespace-pre-line text-justify"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allData = [];
        let displayLimit = 10;
        let currentFilter = 'Semua';

        const q = query(collection(db, "cerita"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snap) => {
            allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            processDisplay();
        });

        function processDisplay() {
            const filteredData = currentFilter === 'Semua' ? allData : allData.filter(s => s.kategori === currentFilter);
            render(filteredData.slice(0, displayLimit));
            document.getElementById('loadMoreBtn').classList.toggle('hidden', filteredData.length <= displayLimit);
        }

        function render(data) {
            const grid = document.getElementById('user-grid');
            if(data.length === 0) {
                grid.innerHTML = '<div class="col-span-2 py-20 text-center opacity-30 italic font-bold text-[10px]">Belum ada konten</div>';
                return;
            }
            grid.innerHTML = data.map((s, idx) => `
                <div class="story-card animate-card" style="animation-delay: ${idx * 0.05}s" onclick="openReader('${s.id}')">
                    <img src="${s.urlGambar || 'https://via.placeholder.com/600x800'}" class="w-full h-full object-cover">
                    <div class="story-overlay">
                        <span class="text-[7px] font-black text-[#facc15] uppercase tracking-widest">${s.kategori || 'STORY'}</span>
                        <h4 class="text-white font-bold text-[11px] leading-tight line-clamp-2">${s.judul || 'Tanpa Judul'}</h4>
                    </div>
                </div>
            `).join('');
        }

        window.loadMore = () => { displayLimit += 10; processDisplay(); };

        window.filterCat = (cat) => {
            closeReader();
            currentFilter = cat;
            displayLimit = 10;
            
            // Update Active State Nav Bawah
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.nav === cat));
            // Update Active State Nav Atas
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.cat === cat));
            
            processDisplay();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.openReader = (id) => {
            const s = allData.find(x => x.id === id);
            if(!s) return;
            document.getElementById('viewImg').src = s.urlGambar || '';
            document.getElementById('viewJudul').innerText = s.judul || 'Tanpa Judul';
            document.getElementById('viewCat').innerText = s.kategori || 'STORY';
            document.getElementById('viewIsi').innerText = s.isi || '';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('reader').scrollTo(0,0);
        };

        window.closeReader = () => { document.getElementById('reader').style.display = 'none'; };
    </script>
</body>
</html>
