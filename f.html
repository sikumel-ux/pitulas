<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="fantasi.css">
</head>
<body class="bg-[#f5f5f5]">
    <header class="header-image pt-10 pb-12 px-8 text-white relative">
        <div class="relative z-10 flex justify-between items-center">
            <a href="index.html" class="text-white opacity-80"><i class="fa-solid fa-arrow-left mr-2"></i> Kembali</a>
            <h2 class="text-xl font-black uppercase">Admin Brankas</h2>
        </div>
    </header>

    <main class="px-6 -mt-8 relative z-20">
        <div class="bg-white rounded-[35px] p-6 shadow-2xl space-y-6">
            <div class="cat-grid" id="categorySelector">
                <div class="cat-item" data-cat="Suami"><div class="cat-icon"><i class="fa-solid fa-house-user"></i></div><span>Suami</span></div>
                <div class="cat-item" data-cat="Mertua"><div class="cat-icon"><i class="fa-solid fa-users-rectangle"></i></div><span>Mertua</span></div>
                <div class="cat-item" data-cat="Teman"><div class="cat-icon"><i class="fa-solid fa-user-group"></i></div><span>Teman</span></div>
                <div class="cat-item" data-cat="3S"><div class="cat-icon"><i class="fa-solid fa-people-roof"></i></div><span>3S</span></div>
                <div class="cat-item" data-cat="Party"><div class="cat-icon"><i class="fa-solid fa-glass-cheers"></i></div><span>Party</span></div>
                <div class="cat-item" data-cat="Video"><div class="cat-icon"><i class="fa-brands fa-twitter"></i></div><span>Video</span></div>
            </div>
            <input type="text" id="judul" class="custom-input" placeholder="Judul Konten">
            <textarea id="isi" rows="5" class="custom-input" placeholder="Tulis cerita atau link video..."></textarea>
            <button id="btnPublish" class="w-full bg-[#053a6f] text-[#facc15] py-5 rounded-[20px] font-black uppercase shadow-lg">Publish Cerita</button>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
