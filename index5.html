<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekawan - Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; padding-bottom: 120px; }
        
        /* HEADER DENGAN GAMBAR */
        .header-top {
            background-image: url('20260308_194220.jpg');
            background-size: cover; background-position: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; min-height: 180px;
            display: flex; flex-direction: column; padding: 50px 25px 0;
        }
        .header-top::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(5, 58, 111, 0.3) 0%, rgba(5, 58, 111, 0.9) 100%);
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        /* NAVIGASI CARD 2 KOLOM */
        .nav-card {
            background: white; border-radius: 20px; padding: 15px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s; border: 2px solid transparent;
        }
        .nav-card.active { border-color: #facc15; background: #053a6f; color: white; }
        .nav-card i { font-size: 18px; color: #facc15; }
        .nav-card.active i { color: white; }
        .nav-card span { font-size: 11px; font-weight: 800; text-transform: uppercase; }

        /* STORY CARD 3:4 */
        .story-card { aspect-ratio: 3/4; border-radius: 25px; overflow: hidden; position: relative; box-shadow: 0 8px 15px rgba(0,0,0,0.1); background: #fff; }
        .story-overlay { 
            position: absolute; inset: 0; 
            background: linear-gradient(0deg, rgba(5, 58, 111, 0.9) 0%, transparent 60%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 15px;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            background: #053a6f; border-radius: 25px; display: flex; 
            justify-content: space-around; padding: 12px; z-index: 999;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: white; opacity: 0.5; flex: 1; }
        .nav-item.active { opacity: 1; color: #facc15; }
        .nav-item span { font-size: 7px; font-weight: 800; text-transform: uppercase; margin-top: 4px; }

        #reader { position: fixed; inset: 0; background: white; z-index: 1000; display: none; overflow-y: auto; }
        .animate-card { animation: fadeInUp 0.4s ease forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header-top text-white">
        <div class="relative z-10 flex justify-end items-center">
            <h2 class="text-xl font-black italic text-[#facc15]">Sekawan<span class="text-white">Pro</span></h2>
        </div>
        <div class="relative z-10 mt-6">
            <p class="text-[9px] font-black uppercase tracking-[3px] opacity-60">Digital Library</p>
            <h3 class="text-lg font-extrabold leading-tight text-white">Brankas Cerita<br>Eksklusif.</h3>
        </div>
    </header>

    <main class="px-5">
        <div class="grid grid-cols-2 gap-3 -mt-8 relative z-20 mb-8">
            <div onclick="filterCat('Suami')" class="nav-card category-btn" data-cat="Suami">
                <i class="fa-solid fa-house-user"></i><span>Suami</span>
            </div>
            <div onclick="filterCat('Mertua')" class="nav-card category-btn" data-cat="Mertua">
                <i class="fa-solid fa-heart"></i><span>Mertua</span>
            </div>
            <div onclick="filterCat('3S')" class="nav-card category-btn" data-cat="3S">
                <i class="fa-solid fa-fire"></i><span>3S</span>
            </div>
            <div onclick="filterCat('Teman')" class="nav-card category-btn" data-cat="Teman">
                <i class="fa-solid fa-comment"></i><span>Teman</span>
            </div>
        </div>

        <h4 id="label-status" class="text-[#053a6f] font-black text-[10px] uppercase mb-4 tracking-widest">Semua Cerita</h4>
        <div class="grid grid-cols-2 gap-4" id="user-grid">
            <div class="story-card animate-pulse bg-gray-200"></div>
            <div class="story-card animate-pulse bg-gray-200"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button onclick="filterCat('Semua')" class="nav-item active" data-nav="Semua"><i class="fa-solid fa-ghost"></i><span>Explore</span></button>
        <button onclick="handleLogout()" class="nav-item text-red-400"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
    </nav>

    <div id="reader">
        <div class="relative w-full h-[50vh]">
            <img id="viewImg" class="w-full h-full object-cover">
            <button onclick="closeReader()" class="absolute top-6 left-6 w-10 h-10 bg-black/40 text-white rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        <div class="p-8 -mt-10 bg-white rounded-t-[40px] relative z-10 min-h-screen">
            <span id="viewCat" class="text-[#053a6f] font-black text-[9px] uppercase tracking-widest"></span>
            <h2 id="viewJudul" class="text-2xl font-black text-[#053a6f] mt-2 leading-tight"></h2>
            <div class="w-12 h-1 bg-yellow-400 my-5 rounded-full"></div>
            <p id="viewIsi" class="text-gray-600 leading-relaxed text-justify whitespace-pre-line"></p>
            <div class="h-32"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allData = [];

        onSnapshot(query(collection(db, "cerita"), orderBy("createdAt", "desc")), (snap) => {
            allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render(allData);
        });

        function render(data) {
            const grid = document.getElementById('user-grid');
            grid.innerHTML = data.length === 0 ? '<p class="col-span-2 text-center py-10 opacity-30">Kosong</p>' : 
            data.map(s => `
                <div class="story-card animate-card" onclick="openReader('${s.id}')">
                    <img src="${s.urlGambar || ''}" class="w-full h-full object-cover">
                    <div class="story-overlay">
                        <span class="text-[7px] font-black text-[#facc15] uppercase tracking-widest">${s.kategori}</span>
                        <h4 class="text-white font-bold text-[10px] line-clamp-2">${s.judul}</h4>
                    </div>
                </div>
            `).join('');
        }

        window.filterCat = (cat) => {
            closeReader();
            // Update Card Navigation UI
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === cat);
            });
            // Update Bottom Nav UI
            document.querySelector('[data-nav="Semua"]').classList.toggle('active', cat === 'Semua');
            
            document.getElementById('label-status').innerText = cat === 'Semua' ? 'Semua Cerita' : 'Kategori: ' + cat;
            render(cat === 'Semua' ? allData : allData.filter(s => s.kategori === cat));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.openReader = (id) => {
            const s = allData.find(x => x.id === id);
            document.getElementById('viewImg').src = s.urlGambar;
            document.getElementById('viewJudul').innerText = s.judul;
            document.getElementById('viewCat').innerText = s.kategori;
            document.getElementById('viewIsi').innerText = s.isi;
            document.getElementById('reader').style.display = 'block';
            document.getElementById('reader').scrollTo(0,0);
        };

        window.closeReader = () => document.getElementById('reader').style.display = 'none';
        window.handleLogout = () => confirm('Keluar?') && (window.location.href = 'login.html');
    </script>
</body>
</html>
