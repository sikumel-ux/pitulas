<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Studio Fantasify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; padding-bottom: 50px; }
        
        .custom-input { width: 100%; padding: 18px; border-radius: 20px; background: #f8fafc; border: 1px solid #e2e8f0; font-weight: 600; outline: none; font-size: 14px; }
        .custom-input:focus { border-color: #053a6f; }
        
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .cat-item.active { opacity: 1; transform: scale(1.05); }
        .cat-icon { width: 45px; height: 45px; background: white; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #053a6f; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .cat-item.active .cat-icon { background: #053a6f; color: #facc15; }
        .cat-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #053a6f; }

        .btn-action { padding: 18px; border-radius: 20px; font-weight: 800; text-transform: uppercase; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-pub { background: #053a6f; color: #facc15; }
        .btn-draft { background: #e2e8f0; color: #64748b; margin-top: 10px; }
        
        #previewContainer { display: none; width: 100%; border-radius: 25px; overflow: hidden; margin-bottom: 20px; position: relative; }
        #imgPreview { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>

    <header class="bg-[#053a6f] pt-12 pb-20 px-8 text-white rounded-b-[45px] mb-[-45px] flex justify-between items-center">
        <a href="index.html" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="font-black uppercase tracking-widest text-[#facc15]">Studio Post</h2>
        <div class="w-10"></div>
    </header>

    <main class="px-6 relative z-10">
        <div class="bg-white rounded-[35px] p-6 shadow-xl space-y-5">
            <div class="cat-grid">
                <div class="cat-item" data-cat="Mertua"><div class="cat-icon"><i class="fa-solid fa-heart-pulse"></i></div><span>Mertua</span></div>
                <div class="cat-item" data-cat="3S"><div class="cat-icon"><i class="fa-solid fa-users"></i></div><span>3S</span></div>
                <div class="cat-item" data-cat="Teman"><div class="cat-icon"><i class="fa-solid fa-face-smile"></i></div><span>Teman</span></div>
                <div class="cat-item" data-cat="Persoka"><div class="cat-icon"><i class="fa-solid fa-shield-halved"></i></div><span>Persoka</span></div>
                <div class="cat-item" data-cat="Party"><div class="cat-icon"><i class="fa-solid fa-couch"></i></div><span>Party</span></div>
                <div class="cat-item" data-cat="Video"><div class="cat-icon"><i class="fa-solid fa-video"></i></div><span>Video</span></div>
            </div>

            <div id="previewContainer">
                <img id="imgPreview" src="">
                <button onclick="removeImg()" class="absolute top-3 right-3 bg-red-500 text-white w-8 h-8 rounded-full shadow-lg"><i class="fa-solid fa-times"></i></button>
            </div>

            <div id="uploadBox" class="w-full p-8 border-2 border-dashed border-gray-100 rounded-[25px] text-center cursor-pointer" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-image text-gray-200 text-3xl mb-2"></i>
                <p class="text-[10px] font-black text-gray-400 uppercase">Ketuk untuk upload foto</p>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </div>

            <input type="text" id="judul" class="custom-input" placeholder="Judul Fantasi...">
            <textarea id="isi" class="custom-input h-32" placeholder="Tulis ceritamu di sini..."></textarea>

            <div class="pt-2">
                <button id="btnPublish" class="btn-action btn-pub">🚀 Terbitkan Sekarang</button>
                <button id="btnSaveDraft" class="btn-action btn-draft">Simpan ke Draft</button>
                <button id="btnCancel" class="hidden w-full text-center mt-4 text-xs font-bold text-red-400" onclick="resetForm()">BATALKAN EDIT</button>
            </div>
        </div>

        <h3 class="mt-10 mb-4 px-2 text-xs font-black text-gray-400 uppercase tracking-widest italic">Semua Postingan</h3>
        <div id="admin-list" class="space-y-3 pb-10"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, onSnapshot, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let selectedCat = "", base64Image = "", currentEditId = null;

        // Image Handling
        document.getElementById('fileInput').onchange = (e) => {
            const reader = new FileReader();
            reader.readAsDataURL(e.target.files[0]);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 800; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    base64Image = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('imgPreview').src = base64Image;
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('uploadBox').style.display = 'none';
                };
            };
        };

        window.removeImg = () => { base64Image = ""; document.getElementById('previewContainer').style.display = 'none'; document.getElementById('uploadBox').style.display = 'block'; };

        // Category Selection
        document.querySelectorAll('.cat-item').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                selectedCat = item.dataset.cat;
            };
        });

        // Save Function
        async function saveData(status) {
            const judul = document.getElementById('judul').value;
            const isi = document.getElementById('isi').value;
            if(!selectedCat || !judul || !isi) return alert("Lengkapi semua field, bro!");

            const btn = status === 'published' ? document.getElementById('btnPublish') : document.getElementById('btnSaveDraft');
            btn.innerText = "Loading...";
            btn.disabled = true;

            try {
                const payload = { judul, kategori: selectedCat, isi, urlGambar: base64Image, status, updatedAt: serverTimestamp() };
                if (currentEditId) {
                    await updateDoc(doc(db, "cerita", currentEditId), payload);
                } else {
                    payload.createdAt = serverTimestamp();
                    await addDoc(collection(db, "cerita"), payload);
                }
                alert("Berhasil disimpan!");
                resetForm();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        window.resetForm = () => { location.reload(); };

        document.getElementById('btnPublish').onclick = () => saveData('published');
        document.getElementById('btnSaveDraft').onclick = () => saveData('draft');

        // Realtime List
        onSnapshot(collection(db, "cerita"), (snap) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = '';
            snap.docs.forEach(d => {
                const item = d.data();
                const isDraft = item.status === 'draft';
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border border-gray-50">
                        <div class="flex-1 min-w-0" onclick="editPost('${d.id}')">
                            <p class="text-[8px] font-black uppercase ${isDraft ? 'text-orange-400' : 'text-blue-400'}">
                                ${item.kategori || 'UMUM'} • ${item.status || 'PUBLISHED'}
                            </p>
                            <h4 class="font-bold text-gray-700 truncate">${item.judul || 'Tanpa Judul'}</h4>
                        </div>
                        <button onclick="deletePost('${d.id}')" class="w-10 h-10 text-red-200 hover:text-red-500 transition-colors"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>`;
            });
        });

        window.editPost = async (id) => {
            const snap = await getDoc(doc(db, "cerita", id));
            if (snap.exists()) {
                const data = snap.data();
                currentEditId = id;
                document.getElementById('judul').value = data.judul;
                document.getElementById('isi').value = data.isi;
                selectedCat = data.kategori;
                document.querySelectorAll('.cat-item').forEach(i => i.classList.toggle('active', i.dataset.cat === selectedCat));
                if (data.urlGambar) {
                    base64Image = data.urlGambar;
                    document.getElementById('imgPreview').src = base64Image;
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('uploadBox').style.display = 'none';
                }
                document.getElementById('btnCancel').classList.remove('hidden');
                document.getElementById('btnPublish').innerText = "Update & Terbitkan";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.deletePost = async (id) => {
            if (confirm("Hapus permanen ceritanya?")) await deleteDoc(doc(db, "cerita", id));
        };
    </script>
</body>
</html>
