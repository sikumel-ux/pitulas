<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sekawan Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f5f5f5; -webkit-tap-highlight-color: transparent; }
        
        .header-image {
            background-image: url('20260308_194220.jpg');
            background-size: cover; background-position: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; min-height: 180px;
        }
        .header-image::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(5, 58, 111, 0.4) 0%, rgba(5, 58, 111, 0.9) 100%);
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        /* Icon Selector Grid */
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .cat-btn {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 15px; border-radius: 20px; background: #f8fafc;
            border: 2px solid transparent; transition: 0.3s; cursor: pointer;
        }
        .cat-btn.selected {
            background: #053a6f; border-color: #facc15; transform: scale(1.05);
        }
        .cat-btn i { font-size: 20px; color: #053a6f; }
        .cat-btn.selected i { color: #facc15; }
        .cat-btn span { font-size: 9px; font-weight: 800; text-transform: uppercase; color: #64748b; }
        .cat-btn.selected span { color: white; }

        /* Input Styling */
        .custom-input {
            width: 100%; padding: 18px; border-radius: 20px;
            background: #f8fafc; border: 1px solid #e2e8f0;
            font-size: 14px; font-weight: 600; color: #053a6f; outline: none;
            transition: 0.3s;
        }
        .custom-input:focus { border-color: #053a6f; background: white; box-shadow: 0 5px 15px rgba(5,58,111,0.05); }

        .btn-publish {
            background: #053a6f; color: #facc15; width: 100%;
            padding: 20px; border-radius: 25px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(5, 58, 111, 0.3);
            transition: 0.3s;
        }
        .btn-publish:active { transform: scale(0.95); opacity: 0.9; }
    </style>
</head>
<body class="pb-20">

    <header class="header-image pt-10 pb-12 px-8 text-white relative">
        <div class="relative z-10 flex justify-between items-center">
            <div>
                <a href="index.html" class="text-white opacity-80 mb-2 block"><i class="fa-solid fa-arrow-left mr-2"></i> Kembali</a>
                <h2 class="text-2xl font-black uppercase tracking-tighter">Brankas Admin</h2>
            </div>
            <div class="bg-[#facc15] p-3 rounded-2xl shadow-lg">
                <i class="fa-solid fa-user-shield text-[#053a6f] text-xl"></i>
            </div>
        </div>
    </header>

    <main class="px-6 -mt-8 relative z-20">
        <div class="bg-white rounded-[35px] p-6 shadow-2xl space-y-6">
            
            <div>
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-4 block px-2">Pilih Kategori Cerita</label>
                <div class="cat-grid" id="categorySelector">
                    <div class="cat-btn" data-cat="Suami">
                        <i class="fa-solid fa-house-user"></i>
                        <span>Suami</span>
                    </div>
                    <div class="cat-btn" data-cat="Mertua">
                        <i class="fa-solid fa-users-rectangle"></i>
                        <span>Mertua</span>
                    </div>
                    <div class="cat-btn" data-cat="Teman">
                        <i class="fa-solid fa-user-group"></i>
                        <span>Teman</span>
                    </div>
                    <div class="cat-btn" data-cat="3S">
                        <i class="fa-solid fa-people-roof"></i>
                        <span>3S</span>
                    </div>
                    <div class="cat-btn" data-cat="Party">
                        <i class="fa-solid fa-glass-cheers"></i>
                        <span>Party</span>
                    </div>
                    <div class="cat-btn" data-cat="Video">
                        <i class="fa-brands fa-twitter"></i>
                        <span>Video</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <input type="text" id="judul" class="custom-input" placeholder="Judul Cerita / Konten">
                
                <textarea id="isi" rows="6" class="custom-input" placeholder="Tulis alur cerita atau tempel link Twitter di sini..."></textarea>
            </div>

            <div class="bg-blue-50 p-4 rounded-2xl flex items-start gap-3">
                <i class="fa-solid fa-circle-info text-[#053a6f] mt-1"></i>
                <p class="text-[9px] text-gray-500 font-bold uppercase leading-relaxed">
                    Data akan otomatis tersimpan dengan tanggal hari ini: <br>
                    <span class="text-[#053a6f]" id="currentDate">08 - 03 - 2026</span>
                </p>
            </div>

            <button onclick="publishContent()" id="btnSave" class="btn-publish mt-4">
                <i class="fa-solid fa-paper-plane mr-2"></i> Publish Sekarang
            </button>
        </div>
    </main>

    <script>
        let selectedCategory = "";

        // Logika Pilih Icon
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedCategory = this.getAttribute('data-cat');
                
                // Jika video, ubah placeholder biar gak bingung
                const isiArea = document.getElementById('isi');
                if(selectedCategory === 'Video') {
                    isiArea.placeholder = "Tempel link Twitter di sini (https://twitter.com/...)";
                } else {
                    isiArea.placeholder = "Tulis alur cerita yang panjang dan detail di sini...";
                }
            });
        });

        async function publishContent() {
            const judul = document.getElementById('judul').value;
            const isi = document.getElementById('isi').value;
            const btn = document.getElementById('btnSave');

            if(!selectedCategory || !judul || !isi) {
                alert("Isi semua dulu, Bro! Jangan buru-buru.");
                return;
            }

            btn.innerText = "MENGIRIM...";
            btn.disabled = true;

            const url = "https://script.google.com/macros/s/AKfycbx9JsUb0saYvFnH8vpCn2JZu_AzdrXXXmQIcGfMW0dsTvPndFQC_CtKyLhMx_6Kjd_IEg/exec";
            
            // Format Tanggal sesuai permintaan: DD - MM - YYYY
            const d = new Date();
            const tgl = `${String(d.getDate()).padStart(2, '0')} - ${String(d.getMonth() + 1).padStart(2, '0')} - ${d.getFullYear()}`;

            const data = {
                judul: judul,
                kategori: selectedCategory,
                isi: isi,
                tanggal: tgl
            };

            try {
                // Gunakan mode no-cors karena Apps Script sering bermasalah dengan CORS redirect
                await fetch(url, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(data)
                });
                
                alert("Boom! Cerita sudah tayang di web.");
                window.location.href = "index.html";
            } catch (error) {
                alert("Waduh gagal, cek koneksi atau API lo.");
                btn.innerText = "Publish Sekarang";
                btn.disabled = false;
            }
        }
    </script>
</body>
              </html>
