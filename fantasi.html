<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Fantasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="fantasi.css">
</head>
<body class="pb-32">
    <header class="header-image pt-10 pb-16 px-6 text-white relative">
        <div class="relative z-10">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-black" id="clock">--:--</h1>
                    <p class="text-[9px] font-bold opacity-70 tracking-widest">08 - 03 - 2026</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-2 rounded-xl border border-white/20"><i class="fa-solid fa-crown text-[#facc15]"></i></div>
            </div>
            <h2 class="text-xl font-extrabold leading-tight">Dunia Rahasia Tiwi</h2>
        </div>
    </header>

    <div class="px-6 -mt-10 relative z-20">
        <div class="bg-white/90 backdrop-blur-lg rounded-[30px] p-5 shadow-xl border border-white/50">
            <div class="cat-grid" id="cat-grid-top">
                <div class="cat-item active" onclick="filterCategory('Semua', this)"><div class="cat-icon"><i class="fa-solid fa-border-all"></i></div><span>Semua</span></div>
                <div class="cat-item" onclick="filterCategory('Suami', this)"><div class="cat-icon"><i class="fa-solid fa-house-user"></i></div><span>Suami</span></div>
                <div class="cat-item" onclick="filterCategory('Mertua', this)"><div class="cat-icon"><i class="fa-solid fa-users-rectangle"></i></div><span>Mertua</span></div>
                <div class="cat-item" onclick="filterCategory('Teman', this)"><div class="cat-icon"><i class="fa-solid fa-user-group"></i></div><span>Teman</span></div>
                <div class="cat-item" onclick="filterCategory('3S', this)"><div class="cat-icon"><i class="fa-solid fa-people-roof"></i></div><span>3S</span></div>
                <div class="cat-item" onclick="filterCategory('Party', this)"><div class="cat-icon"><i class="fa-solid fa-champagne-glasses"></i></div><span>Party</span></div>
                <div class="cat-item" onclick="filterCategory('Video', this)"><div class="cat-icon"><i class="fa-brands fa-twitter"></i></div><span>Video</span></div>
                <a href="admin.html" class="cat-item"><div class="cat-icon bg-yellow-50"><i class="fa-solid fa-plus"></i></div><span>Post</span></a>
            </div>
        </div>
    </div>

    <main class="px-6 mt-8">
        <div id="loading" class="flex flex-col items-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#053a6f] mb-2"></div></div>
        <div id="content-list" class="space-y-6"></div>
    </main>

    <div class="fixed bottom-6 left-6 right-6 z-50">
        <nav class="nav-custom flex justify-between items-center">
            <div class="nav-btn active" onclick="filterCategory('Semua', this)"><i class="fa-solid fa-house"></i><span>Home</span></div>
            <div class="nav-btn" onclick="filterCategory('Mertua', this)"><i class="fa-solid fa-users-rectangle"></i><span>Mertua</span></div>
            <div class="nav-btn" onclick="filterCategory('3S', this)"><i class="fa-solid fa-people-roof"></i><span>3S</span></div>
            <div class="nav-btn" onclick="filterCategory('Party', this)"><i class="fa-solid fa-glass-cheers"></i><span>Party</span></div>
            <div class="nav-btn" onclick="filterCategory('Video', this)"><i class="fa-brands fa-twitter"></i><span>Video</span></div>
        </nav>
    </div>

    <script async src="https://platform.twitter.com/widgets.js"></script>
    <script type="module" src="fantasi.js"></script>
</body>
  </html>
