<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Flyntasify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="fantasi.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                document.body.style.display = "block";
            }
        });
    </script>
    <style> body { display: none; } </style> 
</head>
<body class="pb-36">
    <header class="header-image px-8">
        <div class="relative z-10 w-full">
            <div class="flex justify-between items-center mb-4 pt-8">
                <div>
                    <h1 class="text-3xl font-black text-white" id="clock">00:00</h1>
                </div>
                </div>
            <h2 class="text-xl font-extrabold text-white">Flyntasify </h2>
        </div>
    </header>

    <div class="px-6 -mt-8 relative z-20">
        <div class="bg-white/95 backdrop-blur-md rounded-[30px] p-5 shadow-xl">
            <div class="cat-grid">
                <div class="cat-item active" onclick="filterCategory('Semua', this)"><div class="cat-icon"><i class="fa-solid fa-house"></i></div><span>Semua</span></div>
                <div class="cat-item" onclick="filterCategory('Suami', this)"><div class="cat-icon"><i class="fa-solid fa-heart"></i></div><span>Suami</span></div>
                <div class="cat-item" onclick="filterCategory('Mertua', this)"><div class="cat-icon"><i class="fa-solid fa-heart-pulse"></i></div><span>Mertua</span></div>
                <div class="cat-item" onclick="filterCategory('3S', this)"><div class="cat-icon"><i class="fa-solid fa-users"></i></div><span>3S</span></div>
                <div class="cat-item" onclick="filterCategory('Teman', this)"><div class="cat-icon"><i class="fa-solid fa-face-grin-hearts"></i></div><span>Teman</span></div>
                <div class="cat-item" onclick="filterCategory('Party', this)"><div class="cat-icon"><i class="fa-solid fa-couch"></i></div><span>Party</span></div>
                <div class="cat-item" onclick="filterCategory('Video', this)"><div class="cat-icon"><i class="fa-brands fa-twitter"></i></div><span>Video</span></div>
                <a href="/upload" class="cat-item"><div class="cat-icon bg-yellow-50 text-yellow-600"><i class="fa-solid fa-upload"></i></div><span>Upload</span></a>
            </div>
        </div>
    </div>

    <main class="px-6 mt-8 space-y-6" id="content-list">
        <div id="loading" class="flex justify-center py-20"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#053a6f]"></div></div>
    </main>

    <div class="fixed bottom-6 left-6 right-6 z-50">
        <nav class="nav-custom">
            <div class="nav-btn active" onclick="filterCategory('Semua', this)"><i class="fa-solid fa-home"></i><span>Home</span></div>
            <div class="nav-btn" onclick="filterCategory('Mertua', this)"><i class="fa-solid fa-heart-pulse"></i><span>Mertua</span></div>
            <div class="nav-btn" onclick="filterCategory('3S', this)"><i class="fa-solid fa-users"></i><span>3S</span></div>
            <div class="nav-btn" onclick="filterCategory('Party', this)"><i class="fa-solid fa-couch"></i><span>Party</span></div>
            
            <div class="nav-btn text-red-500 font-bold" id="btnBottomLogout">
                <i class="fa-solid fa-power-off"></i>
                <span>Logout</span>
            </div>
        </nav>
    </div>

    <script type="module" src="idx.js"></script>
    <script type="module">
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        
        const auth = getAuth();

        // Fungsi Logout
        const logoutHandler = () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((err) => {
                console.error("Logout failed:", err);
            });
        };

        // Pasang event ke tombol logout bawah
        const btnLogout = document.getElementById('btnBottomLogout');
        if (btnLogout) {
            btnLogout.addEventListener('click', logoutHandler);
        }
        
        // Update Jam Realtime (Tanpa Tanggal)
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000); 
        updateTime();
    </script>
</body>
                  </html>
