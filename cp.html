<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --deep-blue: #053a6f; --mahika-yellow: #facc15; }
        body { background: #f5f5f5; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto bg-white rounded-[30px] shadow-xl p-8 mt-10">
        <h2 class="text-2xl font-bold text-[#053a6f] mb-6">Tambah Cerita Baru</h2>
        
        <div class="space-y-4">
            <input type="text" id="judul" placeholder="Judul Cerita" class="w-full p-4 rounded-2xl border border-gray-100 focus:outline-none focus:ring-2 focus:ring-[#053a6f]">
            
            <select id="kategori" class="w-full p-4 rounded-2xl border border-gray-100 focus:outline-none focus:ring-2 focus:ring-[#053a6f]">
                <option value="3S">3S (Threesome)</option>
                <option value="4P">4P (Gangbang)</option>
                <option value="Swinger">Swinger</option>
                <option value="Voyeur">Voyeur</option>
            </select>
            
            <textarea id="isi" placeholder="Tulis alur yang soft ke hardcore di sini..." rows="8" class="w-full p-4 rounded-2xl border border-gray-100 focus:outline-none focus:ring-2 focus:ring-[#053a6f]"></textarea>
            
            <button onclick="publishCerita()" id="btnPublish" class="w-full bg-[#053a6f] text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">
                PUBLISH KE WEB
            </button>
        </div>
    </div>

    <script>
        async function publishCerita() {
            const btn = document.getElementById('btnPublish');
            const url = "https://script.google.com/macros/s/AKfycbx9JsUb0saYvFnH8vpCn2JZu_AzdrXXXmQIcGfMW0dsTvPndFQC_CtKyLhMx_6Kjd_IEg/exec";
            
            // Format Tanggal Indonesia (DD - MM - YYYY)
            const d = new Date();
            const tgl = `${String(d.getDate()).padStart(2, '0')} - ${String(d.getMonth() + 1).padStart(2, '0')} - ${d.getFullYear()}`;

            const data = {
                action: "addStory",
                judul: document.getElementById('judul').value,
                kategori: document.getElementById('kategori').value,
                isi: document.getElementById('isi').value,
                tanggal: tgl
            };

            btn.innerText = "MENGIRIM...";
            btn.disabled = true;

            try {
                await fetch(url, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(data)
                });
                alert("Cerita Berhasil Tayang, Bro!");
                window.location.reload();
            } catch (e) {
                alert("Gagal, cek koneksi atau API lo.");
            }
        }
    </script>
</body>
  </html>
