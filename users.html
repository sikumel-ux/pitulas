<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekawan - Pembaca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        
        /* Style sama dengan Admin agar seragam */
        .header-image {
            background-image: url('20260308_194220.jpg');
            background-size: cover; background-position: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; min-height: 150px;
        }
        .header-image::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(5, 58, 111, 0.2) 0%, rgba(5, 58, 111, 0.9) 100%);
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        .nav-scroller::-webkit-scrollbar { display: none; }
        .nav-scroller { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-item { padding: 10px 20px; border-radius: 15px; font-weight: 800; text-transform: uppercase; font-size: 10px; white-space: nowrap; transition: 0.3s; }
        .tab-item.active { background: #facc15; color: #053a6f; }
        .tab-item.inactive { background: rgba(255,255,255,0.1); color: white; }

        /* Card Story 3:4 */
        .story-card { aspect-ratio: 3/4; border-radius: 25px; overflow: hidden; position: relative; cursor: pointer; }
        .story-overlay { 
            position: absolute; inset: 0; 
            background: linear-gradient(0deg, rgba(5, 58, 111, 0.9) 0%, transparent 70%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 15px;
        }

        /* Reader View */
        #reader { position: fixed; inset: 0; background: white; z-index: 50; display: none; overflow-y: auto; }
    </style>
</head>
<body>

    <header class="header-image pt-8 pb-6 px-6 text-white relative">
        <div class="relative z-10 flex justify-between items-center mb-6">
            <h2 class="text-xl font-black uppercase tracking-tighter">Sekawan <span class="text-[#facc15]">App</span></h2>
            <i class="fa-solid fa-bars opacity-50"></i>
        </div>
        
        <div class="relative z-10 flex overflow-x-auto gap-2 nav-scroller" id="tabContainer">
            <button onclick="filterCat('Semua')" class="tab-item active" data-cat="Semua">Semua</button>
            <button onclick="filterCat('Suami')" class="tab-item inactive" data-cat="Suami">Suami</button>
            <button onclick="filterCat('Mertua')" class="tab-item inactive" data-cat="Mertua">Mertua</button>
            <button onclick="filterCat('3S')" class="tab-item inactive" data-cat="3S">3S</button>
            <button onclick="filterCat('Teman')" class="tab-item inactive" data-cat="Teman">Teman</button>
        </div>
    </header>

    <main class="px-5 py-6">
        <div class="grid grid-cols-2 gap-4" id="user-grid">
            <div class="animate-pulse bg-gray-200 story-card"></div>
            <div class="animate-pulse bg-gray-200 story-card"></div>
        </div>
    </main>

    <div id="reader">
        <div class="relative w-full h-[50vh]">
            <img id="viewImg" class="w-full h-full object-cover">
            <button onclick="closeReader()" class="absolute top-6 left-6 w-10 h-10 bg-black/30 backdrop-blur-md text-white rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-8 -mt-10 bg-white rounded-t-[40px] relative z-10">
            <div id="viewCat" class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-2"></div>
            <h2 id="viewJudul" class="text-2xl font-black text-[#053a6f] leading-tight mb-6"></h2>
            <div class="w-full h-[1px] bg-gray-100 mb-6"></div>
            <p id="viewIsi" class="text-gray-600 leading-relaxed whitespace-pre-line"></p>
            <div class="h-20"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        // Config sama persis dengan Admin kamu
        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let stories = [];

        // Ambil semua data, nanti kita filter 'published' di sisi client
        const q = query(collection(db, "cerita"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snap) => {
            stories = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(s => s.status === "published"); // Hanya tampilkan yang published
            
            render(stories);
        });

        function render(data) {
            const grid = document.getElementById('user-grid');
            if(data.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center py-10 opacity-40 italic">Belum ada cerita diterbitkan</p>';
                return;
            }
            grid.innerHTML = data.map(s => `
                <div class="story-card shadow-lg" onclick="openReader('${s.id}')">
                    <img src="${s.urlGambar}" class="w-full h-full object-cover">
                    <div class="story-overlay">
                        <span class="text-[7px] font-black text-[#facc15] uppercase tracking-widest">${s.kategori}</span>
                        <h4 class="text-white font-bold text-xs line-clamp-2">${s.judul}</h4>
                    </div>
                </div>
            `).join('');
        }

        window.filterCat = (cat) => {
            // Update UI Button
            document.querySelectorAll('.tab-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === cat);
                btn.classList.toggle('inactive', btn.dataset.cat !== cat);
            });

            if(cat === 'Semua') {
                render(stories);
            } else {
                render(stories.filter(s => s.kategori === cat));
            }
        };

        window.openReader = (id) => {
            const s = stories.find(x => x.id === id);
            document.getElementById('viewImg').src = s.urlGambar;
            document.getElementById('viewJudul').innerText = s.judul;
            document.getElementById('viewCat').innerText = s.kategori;
            document.getElementById('viewIsi').innerText = s.isi;
            document.getElementById('reader').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        window.closeReader = () => {
            document.getElementById('reader').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
    </script>
</body>
</html>
