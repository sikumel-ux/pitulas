<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Studio Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; padding-bottom: 50px; }
        .custom-input { width: 100%; padding: 18px; border-radius: 20px; background: #f8fafc; border: 1px solid #e2e8f0; font-weight: 600; outline: none; font-size: 14px; }
        textarea.custom-input { min-height: 150px; resize: none; overflow: hidden; }
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .cat-item.active { opacity: 1; transform: scale(1.05); }
        .cat-icon { width: 45px; height: 45px; background: white; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: #053a6f; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .cat-item.active .cat-icon { background: #053a6f; color: #facc15; }
        #previewContainer { display: none; width: 100%; max-width: 400px; border-radius: 25px; overflow: hidden; margin: 0 auto 20px; position: relative; border: 2px dashed #cbd5e1; }
        #imgPreview { width: 100%; height: auto; display: block; }
        .btn-action { padding: 18px; border-radius: 20px; font-weight: 800; text-transform: uppercase; width: 100%; cursor: pointer; border: none; }
        .btn-pub { background: #053a6f; color: #facc15; }
        .btn-draft { background: #facc15; color: #053a6f; margin-top: 10px; }
        .btn-cancel { background: #94a3b8; color: white; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <header class="bg-[#053a6f] pt-10 pb-16 px-8 text-white rounded-b-[40px] mb-[-40px] flex justify-between items-center">
        <a href="index.html" class="opacity-70"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 id="modeTitle" class="text-lg font-black uppercase tracking-widest text-[#facc15]">Studio Post</h2>
        <div></div>
    </header>

    <main class="px-6 relative z-10">
        <div class="bg-white rounded-[35px] p-6 shadow-2xl space-y-6">
            <div class="cat-grid">
                <div class="cat-item" data-cat="Mertua"><div class="cat-icon"><i class="fa-solid fa-heart-pulse"></i></div><span>Mertua</span></div>
                <div class="cat-item" data-cat="3S"><div class="cat-icon"><i class="fa-solid fa-users"></i></div><span>3S</span></div>
                <div class="cat-item" data-cat="Persoka"><div class="cat-icon"><i class="fa-solid fa-shield-halved"></i></div><span>Persoka</span></div>
            </div>

            <div id="previewContainer"><img id="imgPreview" src=""><button type="button" onclick="removeImg()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-lg"><i class="fa-solid fa-times"></i></button></div>

            <div id="uploadPlaceholder" class="w-full p-10 border-2 border-dashed border-gray-200 rounded-[30px] text-center cursor-pointer" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-image text-gray-300 text-4xl mb-2"></i>
                <p class="text-[10px] font-black text-gray-400 uppercase">Upload Foto (Bebas)</p>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </div>

            <input type="text" id="judul" class="custom-input" placeholder="Judul Fantasi">
            <textarea id="isi" class="custom-input" placeholder="Tulis cerita lengkap..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>

            <div class="pt-2">
                <button id="btnPublish" class="btn-action btn-pub">🚀 Terbitkan Sekarang</button>
                <button id="btnSaveDraft" class="btn-action btn-draft">📂 Simpan ke Draft</button>
                <button id="btnCancel" class="btn-action btn-cancel" onclick="resetForm()">❌ Batalkan Edit</button>
            </div>
        </div>

        <h3 class="text-center text-xs font-black text-gray-400 uppercase mt-10 mb-4">Aktivitas Terbaru (Klik untuk Edit)</h3>
        <div id="admin-list" class="space-y-3 pb-10"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs", authDomain: "pitulascom.firebaseapp.com", projectId: "pitulascom", storageBucket: "pitulascom.firebasestorage.app", messagingSenderId: "57896978619", appId: "1:57896978619:web:81503dfde8d568e35d819e" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let selectedCat = "", base64Image = "", currentEditId = null;

        const fileInput = document.getElementById('fileInput');
        fileInput.onchange = (e) => {
            const reader = new FileReader();
            reader.readAsDataURL(e.target.files[0]);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 800; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    base64Image = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('imgPreview').src = base64Image;
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                };
            };
        };

        window.removeImg = () => { base64Image = ""; document.getElementById('previewContainer').style.display = 'none'; document.getElementById('uploadPlaceholder').style.display = 'block'; };

        document.querySelectorAll('.cat-item').forEach(item => {
            item.onclick = () => { document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active')); item.classList.add('active'); selectedCat = item.dataset.cat; };
        });

        async function saveData(status) {
            const judul = document.getElementById('judul').value, isi = document.getElementById('isi').value;
            if(!selectedCat || !judul || !isi) return alert("Isi semua dulu!");
            try {
                const data = { judul, kategori: selectedCat, isi, urlGambar: base64Image, status, updatedAt: serverTimestamp() };
                if (currentEditId) { await updateDoc(doc(db, "cerita", currentEditId), data); alert("Berhasil diupdate!"); }
                else { data.createdAt = serverTimestamp(); await addDoc(collection(db, "cerita"), data); alert("Berhasil disimpan!"); }
                resetForm();
            } catch (e) { alert(e.message); }
        }

        window.resetForm = () => { currentEditId = null; location.reload(); };

        document.getElementById('btnPublish').onclick = () => saveData('published');
        document.getElementById('btnSaveDraft').onclick = () => saveData('draft');

        onSnapshot(query(collection(db, "cerita"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('admin-list'); list.innerHTML = '';
            snap.docs.forEach(d => {
                const item = d.data();
                const badge = item.status === 'draft' ? 'bg-yellow-100 text-yellow-600' : 'bg-green-100 text-green-600';
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border hover:border-[#053a6f]" onclick="editPost('${d.id}')">
                        <div class="flex-1">
                            <p class="text-[7px] font-black uppercase text-gray-400">${item.kategori} • <span class="${badge} px-2 rounded">${item.status || 'published'}</span></p>
                            <h4 class="text-xs font-bold text-gray-700">${item.judul}</h4>
                        </div>
                        <button onclick="event.stopPropagation(); deletePost('${d.id}')" class="text-red-300 ml-4"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
            });
        });

        window.editPost = async (id) => {
            const snap = await getDoc(doc(db, "cerita", id));
            if (snap.exists()) {
                const data = snap.data(); currentEditId = id;
                document.getElementById('judul').value = data.judul;
                document.getElementById('isi').value = data.isi;
                selectedCat = data.kategori;
                document.querySelectorAll('.cat-item').forEach(i => i.classList.toggle('active', i.dataset.cat === selectedCat));
                if (data.urlGambar) { base64Image = data.urlGambar; document.getElementById('imgPreview').src = base64Image; document.getElementById('previewContainer').style.display = 'block'; document.getElementById('uploadPlaceholder').style.display = 'none'; }
                document.getElementById('modeTitle').innerText = "Edit Mode";
                document.getElementById('btnCancel').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.deletePost = async (id) => { if(confirm("Hapus?")) await deleteDoc(doc(db, "cerita", id)); };
    </script>
</body>
</html>
