<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sekawan Private - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="crt.css">
</head>
<body class="unauth" id="bodyWrapper">

    <div id="loginGate" class="login-gate fixed inset-0 z-[100] bg-[#053a6f] flex flex-col items-center justify-center px-10">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-black text-[#053a6f] mb-2 uppercase italic">Sekawan Projects</h2>
            <p class="text-gray-400 text-[9px] font-bold mb-8 uppercase tracking-[0.3em]">Restricted Private Area</p>
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email Akun" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold outline-none focus:border-[#053a6f]">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold outline-none focus:border-[#053a6f]">
                <button id="btnLogin" class="w-full bg-[#053a6f] text-yellow-400 py-4 rounded-2xl font-black uppercase shadow-xl active:scale-95 transition-all">Masuk</button>
            </div>
        </div>
    </div>

    <div class="main-app">
        <header class="header-premium px-10">
            <div class="relative z-10 w-full flex justify-between items-center">
                <div class="text-white">
                    <h1 class="text-2xl font-black uppercase italic tracking-tighter">Sekawan Room</h1>
                    <p class="text-[9px] font-black text-yellow-400 uppercase tracking-widest mt-1">Private Access</p>
                </div>
                <button id="btnLogout" class="text-white/30 text-xl"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <main class="px-6 -mt-10 relative z-20 pb-40">
            <div id="focusArea">
                <div class="text-center py-10 text-slate-400 text-xs font-bold uppercase animate-pulse">Menghubungkan ke Brankas...</div>
            </div>

            <div class="other-stories">
                <h5 class="text-[10px] font-black text-[#053a6f] uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-yellow-500"></i> Cerita Lainnya
                </h5>
                <div id="listLainnya">
                    </div>
            </div>
        </main>

        <nav class="nav-bottom">
            <a href="index.html" class="nav-btn active"><i class="fa-solid fa-house-chimney"></i><span>Home</span></a>
            <a href="gallery.html" class="nav-btn"><i class="fa-solid fa-cloud"></i><span>Cloud</span></a>
            <a href="admin.html" class="nav-btn"><i class="fa-solid fa-pen-nib"></i><span>Tulis</span></a>
        </nav>
    </div>

    <script type="module" src="crt.js"></script>
</body>
</html>
