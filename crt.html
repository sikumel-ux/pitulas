<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sekawan Room - V.02</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="crt.css">
</head>
<body class="unauth" id="mainBody">

    <div class="login-box fixed inset-0 z-[100] bg-[#053a6f] flex flex-col items-center justify-center px-10">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-black text-[#053a6f] mb-2 uppercase italic tracking-tighter">Brankas V.02</h2>
            <p class="text-gray-400 text-[9px] font-bold mb-8 uppercase tracking-[0.3em]">Restricted Access</p>
            <div class="space-y-4 text-left">
                <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold outline-none focus:border-[#053a6f]">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold outline-none focus:border-[#053a6f]">
                <button id="btnLogin" class="w-full bg-[#053a6f] text-[#facc15] py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">Buka Brankas</button>
            </div>
        </div>
    </div>

    <div class="gallery-content">
        <header class="header-image px-10">
            <div class="relative z-10 w-full flex justify-between items-center">
                <div class="text-white">
                    <h1 class="text-2xl font-black uppercase italic tracking-tighter leading-none">Sekawan Room</h1>
                    <p class="text-[9px] font-black text-[#facc15] tracking-[0.4em] uppercase mt-2">Private Access</p>
                </div>
                <button id="btnLogout" class="text-white/40 text-lg"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <main class="px-6 -mt-10 relative z-20 pb-40">
            <div id="contentArea">
                <div class="bg-white rounded-[35px] p-10 shadow-xl text-center">
                    <p class="text-[10px] font-black text-slate-400 animate-pulse tracking-widest">MENGHUBUNGKAN KE SERVER...</p>
                </div>
            </div>

            <div id="archiveSection" class="mt-10 hidden">
                <h5 class="text-[10px] font-black text-[#053a6f] uppercase tracking-[0.3em] mb-4 ml-2 flex items-center">
                    <div class="w-1 h-3 bg-[#facc15] mr-2"></div> Arsip Cerita
                </h5>
                <div id="listLainnya" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <nav class="nav-custom">
        <div class="cat-grid">
            <a href="index.html" class="cat-item active">
                <div class="cat-icon"><i class="fa-solid fa-house"></i></div>
                <span>Home</span>
            </a>
            <a href="gallery.html" class="cat-item">
                <div class="cat-icon"><i class="fa-solid fa-cloud"></i></div>
                <span>Cloud</span>
            </a>
            <a href="admin.html" class="cat-item">
                <div class="cat-icon"><i class="fa-solid fa-pen-nib"></i></div>
                <span>Tulis</span>
            </a>
        </div>
    </nav>

    <script type="module" src="crt.js"></script>
</body>
</html>
