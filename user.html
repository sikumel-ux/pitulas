<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasi Reader - Jelajahi Cerita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* Tab Category Styling */
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tabs { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-item { transition: 0.3s; white-space: nowrap; border-radius: 15px; }
        .tab-item.active { background: #053a6f; color: #facc15; box-shadow: 0 4px 12px rgba(5, 58, 111, 0.2); }

        /* Card Story Styling (Vertical 3:4) */
        .story-card { 
            aspect-ratio: 3/4; 
            position: relative; 
            border-radius: 30px; 
            overflow: hidden; 
            background: #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .story-card:active { transform: scale(0.98); }
        .story-overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(to top, rgba(5, 58, 111, 0.9) 0%, rgba(5, 58, 111, 0.3) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        /* Modal / Detail View */
        #readerView { 
            position: fixed; inset: 0; background: white; z-index: 50; 
            display: none; overflow-y: auto; 
        }
    </style>
</head>
<body>

    <header class="bg-[#053a6f] pt-12 pb-10 px-6 rounded-b-[40px] shadow-lg">
        <div class="flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-white italic">FANTASI<span class="text-[#facc15]">APP</span></h1>
                    <p class="text-[10px] text-blue-200 font-bold uppercase tracking-widest opacity-70">Edisi Eksklusif 2026</p>
                </div>
                <div class="w-10 h-10 bg-[#facc15] rounded-full flex items-center justify-center text-[#053a6f]">
                    <i class="fa-solid fa-bolt"></i>
                </div>
            </div>
            
            <div class="nav-tabs flex overflow-x-auto gap-3 py-2" id="categoryTabs">
                <button onclick="filterCat('Semua')" class="tab-item active px-5 py-2 text-xs font-extrabold uppercase tracking-tight">Semua</button>
                <button onclick="filterCat('Suami')" class="tab-item bg-white/10 text-white px-5 py-2 text-xs font-extrabold uppercase tracking-tight">Suami</button>
                <button onclick="filterCat('Mertua')" class="tab-item bg-white/10 text-white px-5 py-2 text-xs font-extrabold uppercase tracking-tight">Mertua</button>
                <button onclick="filterCat('3S')" class="tab-item bg-white/10 text-white px-5 py-2 text-xs font-extrabold uppercase tracking-tight">3S</button>
                <button onclick="filterCat('Teman')" class="tab-item bg-white/10 text-white px-5 py-2 text-xs font-extrabold uppercase tracking-tight">Teman</button>
            </div>
        </div>
    </header>

    <main class="px-6 py-8">
        <div class="grid grid-cols-2 gap-4" id="storyGrid">
            <div class="animate-pulse bg-gray-200 story-card"></div>
            <div class="animate-pulse bg-gray-200 story-card"></div>
        </div>
    </main>

    <div id="readerView">
        <div class="relative w-full h-[60vh]">
            <img id="detailImg" class="w-full h-full object-cover" src="">
            <button onclick="closeReader()" class="absolute top-6 left-6 w-10 h-10 bg-black/30 backdrop-blur-md text-white rounded-xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        <div class="bg-white rounded-t-[40px] mt-[-40px] relative z-10 p-8">
            <span id="detailCat" class="bg-yellow-100 text-[#053a6f] text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest"></span>
            <h2 id="detailJudul" class="text-2xl font-black text-[#053a6f] mt-4 leading-tight"></h2>
            <div class="w-12 h-1 bg-yellow-400 my-6 rounded-full"></div>
            <p id="detailIsi" class="text-gray-600 leading-relaxed text-sm whitespace-pre-line pb-12"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        // Firebase Config (Sama dengan admin Anda)
        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allStories = [];

        // Fetch Data Realtime
        const q = query(collection(db, "cerita"), where("status", "==", "published"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snap) => {
            allStories = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderStories(allStories);
        });

        function renderStories(data) {
            const grid = document.getElementById('storyGrid');
            grid.innerHTML = data.map(story => `
                <div class="story-card shadow-lg" onclick="openReader('${story.id}')">
                    <img src="${story.urlGambar}" class="w-full h-full object-cover">
                    <div class="story-overlay">
                        <span class="text-[8px] font-black text-[#facc15] uppercase tracking-[0.2em] mb-1">${story.kategori}</span>
                        <h3 class="text-white text-xs font-bold leading-snug line-clamp-2">${story.judul}</h3>
                    </div>
                </div>
            `).join('');
        }

        // Global function for onclick
        window.filterCat = (cat) => {
            // Update UI Tab
            document.querySelectorAll('.tab-item').forEach(btn => {
                btn.classList.remove('active', 'bg-white/10', 'text-white');
                if(btn.innerText.toLowerCase() === cat.toLowerCase()) {
                    btn.classList.add('active');
                } else {
                    btn.classList.add('bg-white/10', 'text-white');
                }
            });

            if(cat === 'Semua') {
                renderStories(allStories);
            } else {
                const filtered = allStories.filter(s => s.kategori === cat);
                renderStories(filtered);
            }
        };

        window.openReader = (id) => {
            const story = allStories.find(s => s.id === id);
            if(!story) return;

            document.getElementById('detailImg').src = story.urlGambar;
            document.getElementById('detailJudul').innerText = story.judul;
            document.getElementById('detailCat').innerText = story.kategori;
            document.getElementById('detailIsi').innerText = story.isi;
            
            document.getElementById('readerView').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        window.closeReader = () => {
            document.getElementById('readerView').style.display = 'none';
            document.body.style.overflow = 'auto';
        };
    </script>
</body>
  </html>
