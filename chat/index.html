<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Chat - Fantasi Kita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #053a6f; overflow: hidden; }
        
        /* Bubble Chat Style */
        .chat-bubble-me { background: #facc15; color: #053a6f; border-radius: 20px 20px 4px 20px; align-self: flex-end; }
        .chat-bubble-tiwi { background: rgba(255,255,255,0.1); color: white; border-radius: 20px 20px 20px 4px; align-self: flex-start; }
        
        /* Custom Scrollbar biar bersih */
        #chatBox::-webkit-scrollbar { width: 0px; }
        .loading-dots span { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="p-6 border-b border-white/10 flex justify-between items-center bg-[#053a6f] z-50 shadow-2xl">
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-white/30"><i class="fa-solid fa-chevron-left text-lg"></i></a>
            <div class="relative">
                <div class="w-10 h-10 rounded-full bg-[#facc15] flex items-center justify-center font-black text-[#053a6f] border-2 border-[#facc15]/20">T</div>
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#053a6f] rounded-full"></div>
            </div>
            <div>
                <h2 class="text-white font-black text-sm uppercase italic tracking-tighter">Tiwi</h2>
                <p class="text-[7px] text-[#facc15] font-black uppercase tracking-[0.3em] animate-pulse">Sedang Basah...</p>
            </div>
        </div>
        <div class="flex gap-4 text-white/20">
            <i class="fa-solid fa-video"></i>
            <i class="fa-solid fa-phone"></i>
        </div>
    </header>

    <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-6 flex flex-col">
        </div>

    <footer class="p-6 bg-[#053a6f] border-t border-white/10">
        <div id="uploadStatus" class="hidden mb-3 text-center">
            <p class="text-[8px] font-black text-[#facc15] uppercase tracking-widest loading-dots">Mengirim Foto <span>.</span><span>.</span><span>.</span></p>
        </div>
        
        <div class="flex items-center gap-3 bg-white/5 p-2 rounded-[30px] border border-white/10 shadow-inner">
            <button onclick="document.getElementById('fileInput').click()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-[#facc15] active:scale-90 transition">
                <i class="fa-solid fa-paperclip"></i>
            </button>
            <input type="file" id="fileInput" class="hidden" accept="image/*">
            
            <input type="text" id="msgInput" placeholder="Kirim kode nakal..." class="flex-1 bg-transparent border-none outline-none text-white text-[11px] font-bold px-2 placeholder:text-white/20">
            
            <button id="btnSend" class="w-10 h-10 rounded-full bg-[#facc15] text-[#053a6f] flex items-center justify-center shadow-lg shadow-[#facc15]/20 active:scale-90 transition">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // SCRIPT URL GOOGLE APPS SCRIPT LO
        const scriptURL = "https://script.google.com/macros/s/AKfycbxmYhZ-5C74fQaLMkAgEMjaXTiJiFzMKyzfR0MN6RTkajXWjXyXywvTft8k9S-w32CZ/exec";

        const chatBox = document.getElementById('chatBox');
        const msgInput = document.getElementById('msgInput');
        const btnSend = document.getElementById('btnSend');
        const fileInput = document.getElementById('fileInput');

        // 1. RENDER PESAN REAL-TIME
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            chatBox.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const isMe = data.sender === "Dimas";
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[80%] p-4 shadow-xl ${isMe ? 'chat-bubble-me' : 'chat-bubble-tiwi'}`;
                
                let content = '';
                if(data.text) content += `<p class="text-[11px] font-bold leading-relaxed">${data.text}</p>`;
                
                if(data.img) {
                    // TRIK DIRECT LINK GOOGLE DRIVE
                    let imgId = "";
                    if(data.img.includes('/d/')) imgId = data.img.split('/d/')[1].split('/')[0];
                    else if(data.img.includes('id=')) imgId = data.img.split('id=')[1];
                    
                    const directImg = imgId ? `https://lh3.googleusercontent.com/u/0/d/${imgId}` : data.img;
                    
                    content += `<img src="${directImg}" class="rounded-xl mt-2 w-full border border-black/5 shadow-md" onerror="this.src='https://placehold.co/400x300/053a6f/facc15?text=Foto+Privat'">`;
                }

                bubble.innerHTML = content + `<p class="text-[6px] mt-2 opacity-30 font-black uppercase text-right tracking-widest">${data.createdAt ? "Sent" : "Sending..."}</p>`;
                chatBox.appendChild(bubble);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // 2. KIRIM PESAN TEKS
        async function sendAction() {
            const val = msgInput.value.trim();
            if(!val) return;
            
            await addDoc(collection(db, "messages"), {
                sender: "Dimas",
                text: val,
                createdAt: serverTimestamp()
            });
            msgInput.value = '';
        }

        btnSend.onclick = sendAction;
        msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendAction(); };

        // 3. KIRIM FOTO KE GDRIVE VIA APPS SCRIPT
        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if(!file) return;

            document.getElementById('uploadStatus').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                
                try {
                    const res = await fetch(scriptURL, {
                        method: "POST",
                        body: JSON.stringify({
                            base64: base64,
                            type: file.type,
                            name: "PRIBADI_" + Date.now()
                        })
                    });
                    const result = await res.json();
                    
                    if(result.result === "success") {
                        await addDoc(collection(db, "messages"), {
                            sender: "Dimas",
                            img: result.url, // URL dari Apps Script
                            createdAt: serverTimestamp()
                        });
                    }
                } catch (err) {
                    alert("Gagal kirim gambar!");
                } finally {
                    document.getElementById('uploadStatus').classList.add('hidden');
                    fileInput.value = '';
                }
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
