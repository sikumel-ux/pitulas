<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasi Kita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="17.css">
</head>
<body class="bg-[#f5f5f5] pb-32">

    <header class="header-gradient pt-12 pb-24 px-6 text-white relative shadow-lg">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight" id="clock">19:31</h1>
                <p class="text-[10px] opacity-70 font-bold tracking-widest" id="date-display">08 - 03 - 2026</p>
            </div>
            <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20">
                <i class="fa-solid fa-bolt-lightning text-[#facc15] text-xl"></i>
            </div>
        </div>
        <div class="mt-4 animate-fade-in">
            <p class="text-[9px] uppercase tracking-[0.3em] opacity-60 font-black">Member Exclusive</p>
            <h2 class="text-xl font-bold mt-1 leading-tight">Koleksi Terlarang Sekawan</h2>
        </div>
    </header>

    <div class="px-6 -mt-12 relative z-10">
        <div class="bg-white rounded-[35px] p-5 shadow-xl flex space-x-6 overflow-x-auto no-scrollbar items-center">
            <div class="cat-item active" onclick="filterCategory('Semua', this)">
                <div class="cat-icon"><i class="fa-solid fa-border-all"></i></div>
                <span>Semua</span>
            </div>
            <div class="cat-item" onclick="filterCategory('Suami', this)">
                <div class="cat-icon"><i class="fa-solid fa-house-chimney-user"></i></div>
                <span>Suami</span>
            </div>
            <div class="cat-item" onclick="filterCategory('Mertua', this)">
                <div class="cat-icon"><i class="fa-solid fa-users-line"></i></div>
                <span>Mertua</span>
            </div>
            <div class="cat-item" onclick="filterCategory('Teman', this)">
                <div class="cat-icon"><i class="fa-solid fa-user-group"></i></div>
                <span>Teman</span>
            </div>
            <div class="cat-item" onclick="filterCategory('3S', this)">
                <div class="cat-icon"><i class="fa-solid fa-people-roof"></i></div>
                <span>3S</span>
            </div>
            <div class="cat-item" onclick="filterCategory('Party', this)">
                <div class="cat-icon"><i class="fa-solid fa-champagne-glasses"></i></div>
                <span>Party</span>
            </div>
            <div class="cat-item" onclick="filterCategory('Video', this)">
                <div class="cat-icon text-red-500"><i class="fa-brands fa-twitter"></i></div>
                <span>Video</span>
            </div>
        </div>
    </div>

    <main class="px-6 mt-10">
        <div id="loading" class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#053a6f]"></div>
        </div>
        <div id="content-list" class="space-y-6">
            </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 bg-white/95 backdrop-blur-xl border border-gray-100 px-6 py-4 flex justify-between items-center rounded-[30px] shadow-2xl z-50">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-fire"></i>
            <span>Viral</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Clips</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Saved</span>
        </div>
        <a href="admin.html" class="nav-item">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Post</span>
        </a>
    </nav>

    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <script type="module" src="17.js"></script>
</body>
              </html>
