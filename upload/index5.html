<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Sekawan - Private Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* State Login */
        .login-box { display: none; }
        .gallery-content { display: none; }
        .auth-active .login-box { display: none; }
        .auth-active .gallery-content { display: block; }
        .unauth .login-box { display: flex; }

        /* Header Styling */
        .header-image {
            background-image: url('20260308_194220.jpg');
            background-size: cover; background-position: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; min-height: 200px; display: flex; align-items: center; justify-content: center;
        }
        .header-image::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(5, 58, 111, 0.4) 0%, rgba(5, 58, 111, 0.9) 100%);
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        /* Navigasi Kategori Bawah (Horizontal Scroll) */
        .nav-category-container {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; padding: 15px 10px 25px 10px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            z-index: 1000; display: flex; overflow-x: auto;
            gap: 12px; scrollbar-width: none;
            border-top-left-radius: 30px; border-top-right-radius: 30px;
        }
        .nav-category-container::-webkit-scrollbar { display: none; }

        .cat-item {
            flex: 0 0 auto; display: flex; flex-direction: column;
            align-items: center; gap: 6px; text-decoration: none; min-width: 60px;
        }
        .cat-icon {
            width: 45px; h-45px; background: #f1f5f9; color: #64748b;
            border-radius: 16px; display: flex; items-center; justify-content: center;
            font-size: 16px; transition: 0.3s; height: 45px;
        }
        .cat-item span { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .cat-item.active .cat-icon { background: #053a6f; color: #facc15; box-shadow: 0 8px 15px rgba(5, 58, 111, 0.2); }
        .cat-item.active span { color: #053a6f; }

        /* Custom Notification Toast */
        #customToast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #053a6f; color: #facc15; padding: 20px;
            border-radius: 25px; font-weight: 800; font-size: 11px; text-transform: uppercase;
            text-align: center; width: 85%; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000;
        }
        #customToast.show { top: 30px; }

        .upload-card { background: white; border-radius: 35px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
    </style>
</head>
<body class="unauth" id="mainBody">

    <div id="customToast">
        <i class="fa-solid fa-check-double mb-2 text-xl block"></i>
        <span id="toastMsg">Foto/video kamu sudah tersimpan, siap dinikmatin atau dipamerkan.</span>
    </div>

    <div class="login-box fixed inset-0 z-[100] bg-[#053a6f] flex flex-col items-center justify-center px-10">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
            <div class="bg-[#facc15] w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-cloud-bolt text-[#053a6f] text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-[#053a6f] mb-2">Private Cloud</h2>
            <p class="text-gray-400 text-[10px] font-bold mb-8 uppercase tracking-widest italic">Akses Terbatas Sekawan</p>
            <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 rounded-2xl bg-gray-50 mb-4 border border-gray-100 font-bold outline-none focus:border-yellow-400 transition-all">
            <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 rounded-2xl bg-gray-50 mb-6 border border-gray-100 font-bold outline-none focus:border-yellow-400 transition-all">
            <button id="btnLogin" class="w-full bg-[#053a6f] text-[#facc15] py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">Buka Brankas</button>
        </div>
    </div>

    <div class="gallery-content">
        <header class="header-image px-8">
            <div class="relative z-10 text-center">
                <h1 class="text-3xl font-black text-white uppercase italic tracking-tighter">Cloud Storage v.02</h1>
                <p class="text-[9px] font-bold text-[#facc15] tracking-[0.4em] uppercase mt-1">Encrypted Room</p>
            </div>
            <button id="btnLogout" class="absolute top-10 right-8 text-white/30 text-xl"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <main class="px-6 -mt-10 relative z-20 pb-40">
            <div class="upload-card">
                <div class="flex items-center justify-between mb-8 px-2">
                    <h3 class="text-[#053a6f] font-black uppercase text-[11px] tracking-widest">Simpan Koleksi</h3>
                    <div class="flex gap-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse delay-75"></div>
                    </div>
                </div>

                <div class="border-2 border-dashed border-slate-100 rounded-[30px] p-10 flex flex-col items-center justify-center text-center bg-slate-50/50 cursor-pointer active:scale-95 transition-all" id="dropZone">
                    <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">
                    <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-5 text-[#053a6f] shadow-lg">
                        <i class="fa-solid fa-plus text-2xl"></i>
                    </div>
                    <p class="font-black text-[#053a6f] text-sm uppercase">Pilih File Baru</p>
                    <p class="text-[9px] text-gray-400 mt-2 font-bold uppercase tracking-widest">Foto atau Video Binal</p>
                </div>

                <div id="uploadStatus" class="mt-8 hidden p-4 bg-[#053a6f]/5 rounded-2xl">
                    <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mb-3">
                        <div id="progressBar" class="bg-[#053a6f] h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <p id="statusText" class="text-[10px] font-black text-[#053a6f] uppercase text-center tracking-tighter italic">Sinkronisasi Cloud...</p>
                </div>
            </div>

            <div class="mt-10 text-center px-4">
                <p class="text-slate-300 text-[10px] font-bold leading-relaxed uppercase tracking-[0.2em]">
                    File yang diupload akan otomatis terenkripsi.
                </p>
            </div>
        </main>
    </div>

    <div class="nav-category-container">
        
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-heart"></i></div>
            <span>Suami</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-users"></i></div>
            <span>Mertua</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-couch"></i></div>
            <span>3S</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-user-secret"></i></div>
            <span>Teman</span>
        </div>
        <div class="cat-item">
            <div class="cat-icon"><i class="fa-solid fa-glass-cheers"></i></div>
            <span>Party</span>
        </div>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // URL GAS LO
        const scriptURL = "https://script.google.com/macros/s/AKfycbxmYhZ-5C74fQaLMkAgEMjaXTiJiFzMKyzfR0MN6RTkajXWjXyXywvTft8k9S-w32CZ/exec";

        document.getElementById('btnLogin').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(() => showToast("Akses Ditolak!", true));
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('mainBody').className = user ? 'auth-active' : 'unauth';
        });

        function showToast(msg, isError = false) {
            const toast = document.getElementById('customToast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.style.background = isError ? '#ef4444' : '#053a6f';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4500);
        }

        const fileInput = document.getElementById('fileInput');
        document.getElementById('dropZone').onclick = () => fileInput.click();

        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            const statusBox = document.getElementById('uploadStatus');
            const pBar = document.getElementById('progressBar');
            
            statusBox.classList.remove('hidden');
            pBar.style.width = "20%";
            
            reader.onload = (e) => {
                pBar.style.width = "50%";
                const base64 = e.target.result.split(',')[1];
                
                fetch(scriptURL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        base64: base64, 
                        type: file.type, 
                        name: "CLOUD_" + Date.now() + "_" + file.name 
                    })
                })
                .then(res => res.json())
                .then(data => {
                    pBar.style.width = "100%";
                    setTimeout(() => {
                        statusBox.classList.add('hidden');
                        pBar.style.width = "0%";
                        showToast("Foto/video kamu sudah tersimpan, siap dinikmatin atau dipamerkan.");
                    }, 1000);
                })
                .catch(() => {
                    showToast("Gagal mengunggah ke Cloud!", true);
                    statusBox.classList.add('hidden');
                });
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
