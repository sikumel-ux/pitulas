<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { display: none; }
        .gallery-content { display: none; }
        .auth-active .login-box { display: none; }
        .auth-active .gallery-content { display: block; }
        .unauth .login-box { display: flex; }
        
        .upload-zone {
            border: 3px dashed rgba(5, 58, 111, 0.1);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
        }
        .upload-zone:active { transform: scale(0.98); border-color: #facc15; background: #fff; }
        
        /* Animasi biar makin smooth */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .anim-pulse { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-50 pb-32 unauth" id="mainBody">

    <div class="login-box fixed inset-0 z-[100] bg-[#053a6f] flex flex-col items-center justify-center px-10 text-center">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm border-b-8 border-[#facc15]">
            <div class="bg-[#facc15] w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fa-solid fa-lock text-[#053a6f] text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-[#053a6f] mb-2">Akses Terbatas</h2>
            <p class="text-gray-400 text-[10px] font-bold mb-8 uppercase tracking-widest">Brankas Foto Sekawan</p>
            
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email Brankas" class="w-full p-4 rounded-2xl bg-gray-50 border border-gray-100 outline-none focus:border-[#053a6f] font-bold text-sm">
                <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 rounded-2xl bg-gray-50 border border-gray-100 outline-none focus:border-[#053a6f] font-bold text-sm">
                <button id="btnLogin" class="w-full bg-[#053a6f] text-[#facc15] py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-transform">Masuk</button>
            </div>
        </div>
    </div>

    <div class="gallery-content">
        <header class="header-image px-8">
            <div class="relative z-10 w-full flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-black text-white uppercase tracking-tighter leading-none">Galeri</h1>
                    <p class="text-[10px] font-bold text-white/60 tracking-[0.3em] mt-2">PRIVATE STORAGE</p>
                </div>
                <button id="btnLogout" class="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/20 text-white shadow-lg">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <main class="px-6 -mt-10 relative z-20">
            <div class="bg-white rounded-[35px] p-6 shadow-xl mb-6 border border-gray-50">
                <div class="flex items-center justify-between mb-6 px-2">
                    <h3 class="text-[#053a6f] font-black uppercase text-[11px] tracking-wider">Upload Foto Terbaru</h3>
                    <i class="fa-solid fa-cloud-arrow-up text-[#facc15]"></i>
                </div>
                
                <div class="upload-zone rounded-[30px] p-10 flex flex-col items-center justify-center text-center cursor-pointer" id="dropZone">
                    <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">
                    <div class="bg-[#053a6f]/5 w-16 h-16 rounded-full flex items-center justify-center mb-4 text-[#053a6f]">
                        <i class="fa-solid fa-camera-retro text-2xl"></i>
                    </div>
                    <p class="text-sm font-black text-[#053a6f]">Klik & Pilih Foto</p>
                    <p class="text-[9px] text-gray-400 mt-2 uppercase font-bold tracking-[0.2em]">Koleksi Pribadi</p>
                </div>

                <div id="uploadStatus" class="mt-6 hidden bg-gray-50 p-5 rounded-3xl border border-gray-100">
                    <div class="w-full bg-gray-200 rounded-full h-1.5 mb-4">
                        <div id="progressBar" class="bg-[#053a6f] h-1.5 rounded-full transition-all duration-700 shadow-[0_0_10px_rgba(5,58,111,0.3)]" style="width: 0%"></div>
                    </div>
                    <div class="flex items-center justify-center gap-3">
                        <div class="w-2 h-2 bg-yellow-400 rounded-full anim-pulse"></div>
                        <p class="text-[10px] font-black text-[#053a6f] uppercase tracking-widest" id="statusText">Mengirim...</p>
                    </div>
                </div>
            </div>

            <a href="https://drive.google.com/drive/folders/1dVzKRslETzDGlqWoEjUrecjykvFlI6TB" target="_blank" class="w-full bg-[#053a6f] text-[#facc15] p-6 rounded-[30px] font-black uppercase text-[10px] flex justify-between items-center shadow-2xl mb-12 border-b-4 border-[#042d56] tracking-[0.1em]">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-google-drive text-lg"></i>
                    <span>Buka Folder G-Drive</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square opacity-50"></i>
            </a>
        </main>
    </div>

    <div class="fixed bottom-6 left-6 right-6 z-50">
        <nav class="nav-custom">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-home"></i><span>Home</span></a>
            <a href="gallery.html" class="nav-btn active"><i class="fa-solid fa-images"></i><span>Galeri</span></a>
            <a href="admin.html" class="nav-btn"><i class="fa-solid fa-pen-nib"></i><span>Tulis</span></a>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Auth Logic
        document.getElementById('btnLogin').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) return alert("Isi dulu, Sayang!");
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert("Akses Ditolak, Bro!"));
        };

        document.getElementById('btnLogout').onclick = () => {
            if(confirm("Mau keluar dari Brankas?")) signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            const body = document.getElementById('mainBody');
            if (user) {
                body.classList.replace('unauth', 'auth-active');
            } else {
                body.classList.replace('auth-active', 'unauth');
            }
        });

        // GAS Upload Logic (Link yang lo kasih)
        const scriptURL = "https://script.google.com/macros/s/AKfycbxmYhZ-5C74fQaLMkAgEMjaXTiJiFzMKyzfR0MN6RTkajXWjXyXywvTft8k9S-w32CZ/exec";
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            const statusBox = document.getElementById('uploadStatus');
            const pBar = document.getElementById('progressBar');
            const sText = document.getElementById('statusText');

            statusBox.classList.remove('hidden');
            pBar.style.width = "20%";
            sText.innerText = "MEMPROSES FILE...";
            
            reader.onload = function(e) {
                pBar.style.width = "50%";
                sText.innerText = "MENGIRIM KE DRIVE...";
                
                const base64 = e.target.result.split(',')[1];
                const rawData = {
                    base64: base64,
                    type: file.type,
                    name: "SEKAWAN_" + Date.now() + "_" + file.name
                };

                fetch(scriptURL, {
                    method: "POST",
                    body: JSON.stringify(rawData)
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        pBar.style.width = "100%";
                        sText.innerText = "FOTO BERHASIL DISIMPAN!";
                        setTimeout(() => statusBox.classList.add('hidden'), 3000);
                    } else {
                        alert("Gagal: " + data.message);
                        statusBox.classList.add('hidden');
                    }
                })
                .catch(err => {
                    alert("Gagal koneksi ke Script!");
                    statusBox.classList.add('hidden');
                });
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
  </html>
