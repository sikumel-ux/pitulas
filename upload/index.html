<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="fantasi.css">
    <style>
        .login-box { display: none; }
        .gallery-content { display: none; }
        .auth-active .login-box { display: none; }
        .auth-active .gallery-content { display: block; }
        .unauth .login-box { display: flex; }
        
        .upload-zone {
            border: 3px dashed #053a6f20;
            transition: 0.3s;
        }
        .upload-zone:hover { border-color: #facc15; background: #facc1505; }
    </style>
</head>
<body class="bg-slate-50 pb-32 unauth" id="mainBody">

    <div class="login-box fixed inset-0 z-[100] bg-[#053a6f] flex-col items-center justify-center px-10 text-center">
        <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm">
            <div class="bg-[#facc15] w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fa-solid fa-lock text-[#053a6f] text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-[#053a6f] mb-2">Akses Terbatas</h2>
            <p class="text-gray-400 text-xs font-bold mb-8 uppercase tracking-widest">Masukkan Akun</p>
            
            <input type="email" id="loginEmail" placeholder="Email" class="w-full p-4 rounded-2xl bg-gray-50 border border-gray-100 mb-4 outline-none focus:border-[#053a6f] font-bold">
            <input type="password" id="loginPass" placeholder="Password" class="w-full p-4 rounded-2xl bg-gray-50 border border-gray-100 mb-6 outline-none focus:border-[#053a6f] font-bold">
            
            <button id="btnLogin" class="w-full bg-[#053a6f] text-[#facc15] py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl">Masuk Sekarang</button>
        </div>
    </div>

    <div class="gallery-content">
        <header class="header-image px-8">
            <div class="relative z-10 w-full flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-black text-white uppercase tracking-tighter">Galeri Foto</h1>
                    <p class="text-[10px] font-bold text-white/70 tracking-[0.3em]">PRIVATE FOLDER</p>
                </div>
                <button id="btnLogout" class="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/20 text-white text-xs font-bold">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <main class="px-6 -mt-10 relative z-20">
            <div class="bg-white rounded-[35px] p-6 shadow-xl mb-8">
                <h3 class="text-[#053a6f] font-black uppercase text-xs mb-4">Upload ke Cloud</h3>
                <div class="upload-zone rounded-3xl p-8 flex flex-col items-center justify-center text-center cursor-pointer" id="dropZone">
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <div class="bg-[#053a6f]/5 w-14 h-14 rounded-full flex items-center justify-center mb-4 text-[#053a6f]">
                        <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                    </div>
                    <p class="text-sm font-bold text-gray-700">Pilih Foto </p>
                    <p class="text-[10px] text-gray-400 mt-1 uppercase">Format: JPG, PNG, MP4</p>
                </div>
                <div id="uploadStatus" class="mt-4 hidden">
                    <div class="w-full bg-gray-100 rounded-full h-2 mb-2">
                        <div id="progressBar" class="bg-[#facc15] h-2 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                    <p class="text-[9px] font-black text-[#053a6f] uppercase text-center" id="statusText">Sedang Mengirim...</p>
                </div>
            </div>

            
        </main>
    </div>

    <div class="fixed bottom-6 left-6 right-6 z-50">
        <nav class="nav-custom">
            <a href="https://boyoke.pegle.com" class="nav-btn"><i class="fa-solid fa-home"></i><span>Home</span></a>
            
            
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApuZ1gyMPnKSPnMLmqR-Nh1NPJ-blZ1Zs",
            authDomain: "pitulascom.firebaseapp.com",
            projectId: "pitulascom",
            storageBucket: "pitulascom.firebasestorage.app",
            messagingSenderId: "57896978619",
            appId: "1:57896978619:web:81503dfde8d568e35d819e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // LOGIN LOGIC
        document.getElementById('btnLogin').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert("Salah akun, Bro!"));
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const body = document.getElementById('mainBody');
            if (user) {
                body.classList.replace('unauth', 'auth-active');
            } else {
                body.classList.replace('auth-active', 'unauth');
            }
        });

        // UPLOAD LOGIC (Via Apps Script API lo)
        const scriptURL = "https://script.google.com/macros/s/AKfycbx9JsUb0saYvFnH8vpCn2JZu_AzdrXXXmQIcGfMW0dsTvPndFQC_CtKyLhMx_6Kjd_IEg/exec";
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            document.getElementById('uploadStatus').classList.remove('hidden');
            document.getElementById('progressBar').style.width = "50%";
            
            reader.onload = function(e) {
                const base64 = e.target.result.split(',')[1];
                const rawData = {
                    base64: base64,
                    type: file.type,
                    name: "FOTO_TIWI_" + Date.now() + "_" + file.name
                };

                fetch(scriptURL, {
                    method: "POST",
                    body: JSON.stringify(rawData)
                })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('progressBar').style.width = "100%";
                    document.getElementById('statusText').innerText = "BERHASIL MASUK DRIVE!";
                    setTimeout(() => document.getElementById('uploadStatus').classList.add('hidden'), 3000);
                })
                .catch(err => alert("Gagal Upload, cek Setting Script-mu, Bro!"));
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
                                                                                                                              </html>
